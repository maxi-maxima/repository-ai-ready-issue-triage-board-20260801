name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: '3.9'
      - run: python -m unittest discover -s tests -v
      - run: python -m py_compile repository_ai_ready_issue_triage_board_20260801/__init__.py repository_ai_ready_issue_triage_board_20260801/cli.py tests/test_cli.py
      - run: python -m repository_ai_ready_issue_triage_board_20260801.cli examples/issues.json --format json
